# CI for gf180-polysynth.
#
# Scope is deliberate and documented, not accidental: this workflow runs the
# **PDK-free** legs only. Everything here needs python3, cocotb from pip, and
# the pinned OSS CAD Suite tarball for Icarus and Verilator. No PDK download,
# no klayout-tools install, no OpenROAD, no Docker. A pull request never waits
# on any of those.
#
# The simulators are pinned rather than taken from apt for two reasons. The
# README's claims name their engines -- "12/12 on Icarus 14.0 and Verilator
# 5.053" -- so CI running a different pair would be checking a different
# thing. And ubuntu-latest's apt Verilator is 5.020, which cocotb 2.1.0's
# shim cannot build against at all. See .github/scripts/install-oss-cad-suite.sh.
#
# The PDK-heavy legs -- `klt synthesize`, `klt place-and-route`, `klt drc`,
# `klt lvs`, `klt sta` against gf180mcu -- are NOT run here and are not
# expected to be. They run locally against a pinned environment and are
# committed as append-only records under `sim/`. That split is stated in
# `sim/README.md` -> "What CI does and does not do". Do not silently move a
# leg across the line: if one moves, update that document in the same change.
#
# Runner choice is also deliberate: every job is `ubuntu-latest`, a hosted
# runner. Do NOT route any of this to `[self-hosted, heavy]` -- issue #1971
# found that pool queue-starved, and none of this work needs it. Each job
# below finishes in single-digit minutes on a hosted runner.
#
# CI mints no evidence records. A green run means the sources still build and
# the bit-exact comparison still passes on two simulators -- a smaller claim
# than anything under `sim/`.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COCOTB_VERSION: "2.1.0"

jobs:
  lint:
    name: lint (python, json, shell, verilator -Wall, ROM freshness)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache the pinned OSS CAD Suite
        uses: actions/cache@v4
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-linux-x64-20260916

      - name: Install the pinned OSS CAD Suite (Icarus 14.0, Verilator 5.053)
        run: bash .github/scripts/install-oss-cad-suite.sh

      # Step 5 regenerates rtl/*.vh through spec/reference/synth_ref.py, which
      # imports numpy. Without it that step failed with ModuleNotFoundError and
      # the ROM-freshness check never ran.
      - name: Install numpy (rtl/gen_tables.py imports the reference model)
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Lint
        run: bash .github/scripts/lint.sh

  reference:
    name: reference model self-test (102 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install numpy + pytest
        run: python3 -m pip install --disable-pip-version-check numpy pytest

      # The reference model IS the executable half of the frozen contract
      # (spec/NUMERIC-CONTRACT.md). If its own suite breaks, every "bit-exact"
      # claim downstream of it is meaningless, so this runs before and
      # independently of anything that touches the RTL.
      - name: pytest spec/reference
        working-directory: spec/reference
        run: python3 -m pytest -q test_synth_ref.py

  bitexact:
    name: bit-exact cocotb suite (${{ matrix.sim }}, NV=${{ matrix.nv }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Both engines, at the RTL default and at the contract's own voice
        # count. NV=4 is the configuration the contract specifies; NV=2 is
        # what rtl/synth_core.v defaults to, so both are load-bearing.
        sim: [icarus, verilator]
        nv: [2, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache the pinned OSS CAD Suite
        uses: actions/cache@v4
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-linux-x64-20260916

      - name: Install the pinned OSS CAD Suite (Icarus 14.0, Verilator 5.053)
        run: bash .github/scripts/install-oss-cad-suite.sh

      - name: Install cocotb + numpy
        run: |
          python3 -m pip install --disable-pip-version-check \
            "cocotb==${COCOTB_VERSION}" numpy

      # Every output sample is compared against spec/reference/synth_ref.py
      # with no tolerance. tb/run_tb.py reads the results XML and exits
      # non-zero on any failure -- cocotb's own runner does not.
      - name: Run the bench
        run: python3 tb/run_tb.py --sim ${{ matrix.sim }} --nv ${{ matrix.nv }}

  i2s:
    name: I2S transmitter testbench (+ negative control)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cache the pinned OSS CAD Suite
        uses: actions/cache@v4
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-linux-x64-20260916

      - name: Install the pinned OSS CAD Suite (Icarus 14.0, Verilator 5.053)
        run: bash .github/scripts/install-oss-cad-suite.sh

      # fpga/i2s_tx.v sits OUTSIDE the cocotb bench's boundary -- that stops at
      # synth_core's sample port -- so a fully green bit-exact suite says
      # nothing about it. The prototype's transmitter was wrong in two ways
      # (MSB one BCLK late, and a fresh sample per half-frame) and this is the
      # check that would have caught both. `sim-check` requires the committed
      # RTL to pass AND the INJECT_BUG_I2S build to fail.
      - name: Decode SDATA the way a DAC does
        working-directory: fpga
        run: make sim-check

  negative-controls:
    name: injected-bug negative controls (must fail)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache the pinned OSS CAD Suite
        uses: actions/cache@v4
        with:
          path: ~/oss-cad-suite
          key: oss-cad-suite-linux-x64-20260916

      - name: Install the pinned OSS CAD Suite (Icarus 14.0, Verilator 5.053)
        run: bash .github/scripts/install-oss-cad-suite.sh

      - name: Install cocotb + numpy
        run: |
          python3 -m pip install --disable-pip-version-check \
            "cocotb==${COCOTB_VERSION}" numpy

      # A passing suite proves nothing until you have watched it fail. Each
      # INJECT_BUG_* define reintroduces one real defect; the suite MUST
      # catch every one. This job fails if any injected bug survives -- which
      # is how the prototype discovered that its own bench had a blind spot
      # on one contract sentence (INJECT_BUG_ENV survived 9/9 until a
      # targeted test was written for it).
      # Require exit status exactly 1 -- "the suite ran and tests failed".
      # Accepting any non-zero status is what let this job pass vacuously:
      # when tb/run_tb.py died at `import synth_ref` before a single test
      # executed, every one of the four "caught" lines below was printed in
      # about half a second, and the job went green while proving nothing.
      # Exit 2 now means no verdict exists, and that is a failure here.
      - name: Every injected bug must be caught
        run: |
          set -u
          bad=""
          for bug in GAIN TICK UART ENV; do
            python3 tb/run_tb.py --sim icarus --define "INJECT_BUG_$bug=1" \
              > "/tmp/bug-$bug.log" 2>&1 && rc=0 || rc=$?
            case "$rc" in
              1) echo "caught INJECT_BUG_$bug" ;;
              0) echo "::error::INJECT_BUG_$bug SURVIVED the suite"
                 tail -30 "/tmp/bug-$bug.log"; bad="$bad $bug(survived)" ;;
              *) echo "::error::INJECT_BUG_$bug: suite did not run (exit $rc) -- no verdict"
                 tail -30 "/tmp/bug-$bug.log"; bad="$bad $bug(did-not-run)" ;;
            esac
          done
          if [ -n "$bad" ]; then echo "failed:$bad"; exit 1; fi
